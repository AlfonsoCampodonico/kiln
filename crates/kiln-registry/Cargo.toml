[package]
name = "kiln-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minimal, verifying OCI distribution client for kiln"

[dependencies]
base64 = "0.23.1"
kiln-store = { path = "../kiln-store" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
