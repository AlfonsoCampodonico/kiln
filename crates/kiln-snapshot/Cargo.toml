[package]
name = "kiln-snapshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The kiln snapshot artifact: a vmkit bundle as content-addressed chunks"

[dependencies]
kiln-oci = { path = "../kiln-oci" }
kiln-registry = { path = "../kiln-registry" }
kiln-store = { path = "../kiln-store" }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
