[package]
name = "kiln"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Build microVM images from OCI images"

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
kiln-image = { path = "../kiln-image" }
kiln-oci = { path = "../kiln-oci" }
kiln-proto = { path = "../kiln-proto" }
kiln-registry = { path = "../kiln-registry" }
kiln-run = { path = "../kiln-run" }
kiln-store = { path = "../kiln-store" }
rlimit = "0.11.0"
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"

[dev-dependencies]
base64 = "0.23.1"
kiln-erofs = { path = "../kiln-erofs" }
assert_cmd = "2.2.2"
predicates = "3.1.4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "pty", "termios"] }
