[package]
name = "kiln-shim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A containerd shim v2 that runs Kubernetes pods in kiln microVMs"

[[bin]]
name = "containerd-shim-kiln-v1"
path = "src/main.rs"

[dependencies]
# Sync mode (no `async` feature); ttrpc and protobuf come through its re-exports.
containerd-shim = "0.11.0"
kiln-proto = { path = "../kiln-proto" }
kiln-run = { path = "../kiln-run" }
log = "0.4.34"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
kiln-image = { path = "../kiln-image" }
kiln-store = { path = "../kiln-store" }
rustix = { version = "1.1.5", features = ["fs", "mount", "process", "thread"] }
vmkit.workspace = true

[dev-dependencies]
# The version ttrpc 0.9 uses, for a test TtrpcContext.
crossbeam = "0.8"
tempfile = "3.27.0"
