[workspace]
resolver = "3"
members = ["crates/*"]

# The VMMs run on Linux only; elsewhere `kiln run` explains how to use a Lima VM. Pinned to
# vmkit's snapshot-restore branch: snapshot, restore and lazy restore (lazy-restore design).
[workspace.dependencies]
vmkit = { git = "https://github.com/AlfonsoCampodonico/vmkit", rev = "5cfb2f9a4e0bc605bccda93ece7bfa96e49f09b9" }

[workspace.package]
edition = "2024"
license = "Apache-2.0"
