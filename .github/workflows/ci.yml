name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
  # kiln-init and the hostile test guest, static, for both architectures.
  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - name: Lint and build for x86_64 and aarch64
        env:
          # rust-lld links musl binaries without a C cross toolchain.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo clippy --locked --release --target "$target" -p kiln-init -p kiln-testguest -- -D warnings
            cargo build --locked --release --target "$target" -p kiln-init -p kiln-testguest
            file "target/$target/release/kiln-init" | tee /dev/stderr | grep -q 'static'
          done
  ext4-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The committed ext4 template is reproducible
        run: |
          assets/make-ext4-template.sh "$RUNNER_TEMP/ext4-template.img.zst"
          cmp "$RUNNER_TEMP/ext4-template.img.zst" crates/kiln-image/assets/ext4-template.img.zst
  # The boot suite (kiln-run) and kiln run end to end on x86_64 KVM with both VMMs, set up as vmkit's own contract job is (hosted arm64
  # runners have no /dev/kvm; aarch64 runs in the Lima VM).
  boot-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Allow KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update && sudo apt-get install -y busybox-static flex bison bc libelf-dev libssl-dev passt nftables jq
      - name: Find the pinned vmkit
        id: vmkit
        run: |
          vmkit=$(cargo metadata --locked --format-version 1 | jq -c '.packages[] | select(.name == "vmkit")')
          echo "dir=$(dirname "$(jq -r .manifest_path <<<"$vmkit")")" >> "$GITHUB_OUTPUT"
          echo "rev=$(jq -r .source <<<"$vmkit" | sed 's/.*#//')" >> "$GITHUB_OUTPUT"
      - run: '"${{ steps.vmkit.outputs.dir }}/scripts/install-vmms.sh" "$HOME/.local/bin"'
      - uses: actions/cache@v4
        with:
          path: out/vmlinux-*-x86_64
          key: vmkit-kernel-x86_64-${{ steps.vmkit.outputs.rev }}
      - name: Build vmkit's kernel (cached per vmkit revision)
        run: ls out/vmlinux-*-x86_64 2>/dev/null || "${{ steps.vmkit.outputs.dir }}/kernels/build.sh" x86_64 out
      - name: vmkit's sandbox helper and its AppArmor profile
        run: |
          cargo build --locked --manifest-path "${{ steps.vmkit.outputs.dir }}/Cargo.toml" --bin vmkit-sandbox --target-dir target
          "${{ steps.vmkit.outputs.dir }}/scripts/install-apparmor.sh" "$PWD/target/debug/vmkit-sandbox"
      - name: Boot suite, Firecracker and Cloud Hypervisor
        # About half the CPUs: every test boots its own VMs.
        run: |
          export PATH="$HOME/.local/bin:$PATH" KILN_TEST_NET=1
          threads=$(( $(nproc) > 1 ? $(nproc) / 2 : 1 ))
          scripts/boot-tests.sh out/vmlinux-*-x86_64 -- --test-threads=$threads
  registries:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      distribution:
        image: registry:3
        ports:
          - 5000:5000
      zot:
        image: ghcr.io/project-zot/zot:v2.1.21
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kiln-image --test registries
        env:
          KILN_TEST_REGISTRIES: localhost:5000,localhost:5001
  golden-immutable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Existing golden files must not change
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-status "origin/$BASE_REF...HEAD" -- crates/kiln-erofs/tests/golden/ | awk '$1 != "A"')
          if [ -n "$changed" ]; then
            echo "Golden digests are immutable. Bump kiln_erofs::FORMAT_VERSION and add a new digests-vN.txt:"
            echo "$changed"
            exit 1
          fi
  linux-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y erofs-utils jq
      - run: KILN_KERNEL_TESTS=1 cargo test -p kiln-erofs --test kernel
      - run: KILN_KERNEL_TESTS=1 scripts/run-root-test.sh kernel
        env:
          KILN_REQUIRE_LINUX_TESTS: "1"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: tools/oracle/go.sum
      - run: (cd tools/oracle && go build -o "$GITHUB_WORKSPACE/target/oracle" .)
      - run: KILN_ORACLE="$GITHUB_WORKSPACE/target/oracle" scripts/run-root-test.sh oracle
        env:
          KILN_REQUIRE_LINUX_TESTS: "1"
